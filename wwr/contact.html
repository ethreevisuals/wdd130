<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Company</title>
    <meta name="description"
      content="Contact Whitewater Rafting Company to plan your river trip. Get our address, find our location on the map, meet our staff, or send us a message.">
    <meta name="author" content="Anthony Gelli">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Wireframe Top: Company Title & Address Block -->
        <section class="company-header">
            <h1>Whitewater Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Salmon, Idaho 83467</p>
            <p>+1 555 123 4567</p>
            <p>info@whitewaterrafting.com</p>
        </section>

        <!-- Wireframe Middle: Map (Left) and Form (Right) Grid -->
        <section class="map-form-grid">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2870.384729105417!2d-113.89658232348574!3d45.17822597107297!2m3!1f0!1f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x535817bc1033bb7f%3A0x6b899b827e6ebbd9!2sSalmon%2C%20ID%2083467!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  width="400" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="contact-form-container">
                <form action="#" method="post">
                    <div class="form-item">
                        <label for="username">Name</label>
                        <input type="text" id="username" name="username" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-item">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail"
                          placeholder="Placeholder" required>
                    </div>

                    <div class="form-item radio-group">
                        <p><strong>Message Purpose</strong></p>
                        <label><input type="radio" id="general" name="purpose" value="general"
                              checked> General Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"
                              value="reservation"> Reservation Question</label>
                        <label><input type="radio" id="suggestion" name="purpose"
                              value="suggestion"> Website Suggestion</label>
                    </div>

                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="form-item checkbox-item">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <!-- Wireframe Bottom: "We Are Here to Serve You" Employee Profiles -->
        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Sarah Jenkins - Head River Guide">
                    <figcaption><strong>Sarah Jenkins</strong><br>Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Mike Reynolds - Operations Manager">
                    <figcaption><strong>Mike Reynolds</strong><br>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Elena Rostova - Safety Coordinator">
                    <figcaption><strong>Elena Rostova</strong><br>Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 ❖ Whitewater Rafting Company ❖ Anthony Gelli</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
                  alt="Facebook Icon"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
                  alt="Twitter Icon"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
